services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biolexicon
      POSTGRES_PASSWORD: biolexicon
      POSTGRES_DB: biolexicon
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolexicon"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgres://biolexicon:biolexicon@db:5432/biolexicon
      JWT_SECRET: dev-jwt-secret-change-in-prod
      DEV_API_KEY: dev-api-key
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    depends_on:
      - api

volumes:
  pgdata:
